<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header bar ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #4fc3f7;
    }
    .header .badge {
      font-size: 11px;
      background: #2e7d32;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* ── Channel selector ───────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #1e1e1e;
      flex-shrink: 0;
    }
    .controls label {
      font-size: 13px;
      color: #aaa;
    }
    .controls select {
      flex: 1;
      max-width: 500px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #eee;
      font-size: 13px;
    }
    .controls button {
      padding: 6px 18px;
      border: none;
      border-radius: 6px;
      background: #4fc3f7;
      color: #000;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .controls button:hover { background: #039be5; color: #fff; }

    /* ── Video container ────────────────────────── */
    .video-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Status bar ─────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 16px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      font-size: 11px;
      color: #888;
      flex-shrink: 0;
    }
    .status-bar .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #666;
      display: inline-block;
    }
    .status-bar .dot.live { background: #e53935; }
    .status-bar .dot.buffering { background: #ffa726; }
    .status-bar .dot.playing { background: #43a047; }

    /* ── Log panel ──────────────────────────────── */
    .log-panel {
      max-height: 120px;
      overflow-y: auto;
      padding: 6px 16px;
      background: #0d0d0d;
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }
    .log-panel .log-line { padding: 1px 0; }
    .log-panel .log-line.warn { color: #ffa726; }
    .log-panel .log-line.error { color: #e53935; }
    .log-panel .log-line.info { color: #4fc3f7; }

    /* Custom URL input */
    .custom-url {
      display: none;
      padding: 10px 16px;
      background: #1e1e1e;
    }
    .custom-url.visible { display: flex; gap: 10px; align-items: center; }
    .custom-url input {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: #eee;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>IPTV Electron Player</h1>
    <span class="badge">TiviMate UA</span>
    <span class="badge" style="background:#1565c0">FFmpeg AC-3→AAC</span>
  </div>

  <div class="controls">
    <label>Channel:</label>
    <select id="channelSelect">
      <option value="">— Select a channel —</option>
      <option value="http://cf.pro-cdn.me/live/8157047959/63329f4894/441307.ts">FOX SPORTS 501 HD (TS)</option>
      <option value="http://cf.pro-cdn.me/live/8157047959/63329f4894/1519964.ts">Live TS Stream</option>
      <option value="http://cf.pro-cdn.me/live/8157047959/63329f4894/1290248.ts">4K Sky Sport (TS)</option>
      <option value="http://cf.pro-cdn.me/live/8157047959/63329f4894/1290338.ts">TNT SPORTS ULTIMATE 4K (TS)</option>
      <option value="http://cf.pro-cdn.me/live/8157047959/63329f4894/441307.m3u8">FOX SPORTS 501 HD (HLS)</option>
      <option value="custom">Custom URL...</option>
    </select>
    <button id="playBtn">▶ Play</button>
    <button id="stopBtn" style="background:#e53935;color:#fff">■ Stop</button>
  </div>

  <div class="custom-url" id="customUrlRow">
    <label style="font-size:13px;color:#aaa">URL:</label>
    <input id="customUrl" type="text" placeholder="http://example.com/stream.ts" />
  </div>

  <div class="video-wrapper">
    <div data-shaka-player-container>
      <video id="video" autoplay data-shaka-player></video>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="dot" id="statusDot"></span></span>
    <span id="statusText">Idle</span>
    <span id="codecInfo">—</span>
    <span id="bufferInfo">Buffer: —</span>
    <span id="speedInfo">Speed: —</span>
    <span style="margin-left:auto" id="uaInfo">UA: TiviMate/4.7.0</span>
  </div>

  <div class="log-panel" id="logPanel"></div>

  <!-- Load the compiled Shaka Player build (includes ProgressiveStreamingEngine) -->
  <script src="shaka-player.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
